name: Generate Datas

on:
  # Executa automaticamente a cada 24 horas
  schedule:
    - cron: "0 0 * * *"
  
  # Permite rodar manualmente na aba "Actions" do GitHub
  workflow_dispatch:
  
  # Executa sempre que houver um push nabranch main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Baixa o repositório
      - name: Checkout
        uses: actions/checkout@v3

      # 2. Gera os arquivos da cobrinha (snake-dark.svg)
      - name: Generate snake.svg
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Mayconsv
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      # 3. Envia os arquivos gerados para uma branch chamada "output"
      - name: Push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}